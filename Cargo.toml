[package]
name = "mac-headroom"
version = "0.2.0"
edition = "2021"
description = "Disk pressure diagnostician and cache cleaner for macOS developers"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
