[package]
name = "mac-headroom"
version = "0.2.2"
edition = "2021"
description = "Find where macOS disk space went, and clear caches safely. Every command answers in JSON, states why each thing is safe to delete, and is a dry run unless told otherwise, so an AI agent can diagnose a full disk and explain it before anything is removed."
license = "MIT"
repository = "https://github.com/joshua-mason/mac-headroom"
homepage = "https://github.com/joshua-mason/mac-headroom"
readme = "README.md"
keywords = ["disk-usage", "macos", "cleanup", "json", "ai-agent"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github", "/out", "/skill"]

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
