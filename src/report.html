<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mac-headroom report</title>
<style>
:root{color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--rule:#ddddd4;
  --used:#2a78d6;--free:#eb6834;--other:#cde2fb;
  --grow:#e34948;--shrink:#2a78d6;
  --ok:#006300;--warn:#d03b3b;--note:#52514e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--rule:#2c2c2a;
  --used:#3987e5;--free:#d95926;--other:#104281;
  --grow:#e66767;--shrink:#3987e5;
  --ok:#0ca30c;--warn:#e66767;--note:#c3c2b7}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:40px 20px 64px;
  -webkit-font-smoothing:antialiased}
main{max-width:880px;margin:0 auto}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
h2{font-size:12px;font-weight:600;margin:0 0 18px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.meta{color:var(--muted);font-size:13px;margin:2px 0 0}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--ink)}
section{padding:32px 0;border-bottom:1px solid var(--rule)}
.panel section:last-child{border-bottom:0}
[hidden]{display:none!important}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-top:28px;overflow-x:auto}
.tabs button{appearance:none;-webkit-appearance:none;background:none;border:0;border-radius:0;
  font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;
  padding:11px 15px;margin:0 0 -1px;border-bottom:2px solid transparent}
.tabs button:hover:not([aria-selected="true"]){color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{font-weight:400;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"] .n{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.ink2{color:var(--ink2)}.muted{color:var(--muted)}
/* verdict */
.verdict{padding:26px 0 4px}
.verdict .head{font-size:26px;font-weight:600;line-height:1.25;letter-spacing:-.01em;margin:0 0 8px;
  max-width:36ch;border-left:3px solid var(--note);padding-left:16px}
.verdict.ok .head{border-color:var(--ok)}
.verdict.warn .head{border-color:var(--warn)}
.verdict .body{color:var(--ink2);margin:0 0 0 19px;max-width:62ch}
/* figures */
.figs{display:flex;gap:40px;flex-wrap:wrap;margin-bottom:22px}
.fig .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.fig .v{font-size:22px;font-weight:600;line-height:1.3}
.fig.lead .v{font-size:40px;letter-spacing:-.02em}
.fig[data-tip]{cursor:help}
.fig[data-tip] .k{display:inline-block;border-bottom:1px dotted var(--axis)}
/* composition */
.comp{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--other);margin-bottom:10px}
.comp>div{height:100%;border-right:2px solid var(--page)}
.keys{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
.ln{display:inline-block;width:14px;height:2px;margin-right:7px;vertical-align:4px}
svg{display:block;width:100%;height:auto}
.gl{stroke:var(--grid);stroke-width:1}
.ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.cap{color:var(--ink2);margin:12px 0 0;max-width:68ch}
.hint{color:var(--ink2);background:linear-gradient(90deg,var(--surface),transparent);
  border-left:2px solid var(--axis);padding:10px 14px;margin:16px 0 0;max-width:68ch}
/* tree */
.tree{margin-top:4px}
.treebar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 10px}
.treebar button{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--ink2);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.treebar button:hover{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:5px;overflow:hidden;margin-bottom:14px}
.seg button{appearance:none;-webkit-appearance:none;background:var(--surface);color:var(--ink2);
  font:inherit;font-size:13px;line-height:1.2;text-decoration:none;cursor:pointer;
  border:0;border-right:1px solid var(--axis);border-radius:0;padding:6px 16px;margin:0}
.seg button:last-child{border-right:0}
.seg button:hover:not([disabled]):not([aria-pressed="true"]){color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.seg button[disabled]{opacity:.45;cursor:default}
.floor{color:var(--muted);font-size:13px;margin:10px 0 0}
.node{display:grid;grid-template-columns:minmax(0,1fr) 240px 88px;gap:16px;align-items:center;
  padding:3px 0;border-radius:3px}
.node:hover{background:var(--surface)}
.nm{display:flex;align-items:center;min-width:0}
.nm .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw{flex:none;width:16px;margin-left:-16px;color:var(--muted);font-size:10px;line-height:1;
  text-align:center;cursor:pointer;user-select:none}
.tw.leaf{cursor:default;opacity:0}
.node.open>.nm>.tw{transform:rotate(90deg)}
.track{position:relative;height:13px}
.track .bar{position:absolute;top:0;height:13px;background:var(--used);border-radius:0 2px 2px 0;min-width:2px}
.track .bar.pos{background:var(--grow)}
.track .bar.neg{background:var(--shrink);border-radius:2px 0 0 2px}
.track .mid{position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:var(--axis)}
.node .amt{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.node.rest .lbl,.node.rest .amt{color:var(--muted);font-style:italic}
.node.rest .bar{opacity:.3}
.node.sum{font-weight:600}
.node.sum .amt{color:var(--ink)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--axis);
  color:var(--muted);margin-left:6px;font-style:normal;font-weight:400}
/* tables */
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.07em;padding:0 10px 7px 0;border-bottom:1px solid var(--axis);white-space:nowrap}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--grid);vertical-align:top}
td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.off td{color:var(--muted)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.on{background:var(--ok)}.dot.no{background:var(--axis)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--ink2);font-size:13px}
summary:hover{color:var(--ink)}
pre{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:12px;
  overflow-x:auto;margin:10px 0 0;font-size:12px;white-space:pre-wrap;line-height:1.45}
.scroll{overflow-x:auto}
.empty{color:var(--muted);max-width:68ch}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--page);border-radius:4px;
  padding:7px 10px;font-size:12px;display:none;max-width:420px;overflow-wrap:anywhere;z-index:9;line-height:1.5}
#tip b{font-weight:600}
@media (max-width:560px){
  .figs{gap:22px}.fig.lead .v{font-size:32px}.verdict .head{font-size:21px}
  .node{grid-template-columns:minmax(0,1fr) 96px;gap:10px}
  .node .track{display:none}
}
/* overview */
.statusline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 6px}
.statusline .big{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.level{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--axis);color:var(--ink2)}
.level.good{color:var(--ok);border-color:var(--ok)}
.level.tight,.level.low{color:#9a5b00;border-color:#d99a2b}
.level.full{color:var(--warn);border-color:var(--warn)}
.sub{color:var(--ink2);margin:0 0 14px;max-width:66ch}
/* The status meter. Not .bar: the tree and volume rows already use that class,
   and a margin here shifted every one of their bars off its row. */
.fillbar{height:10px;border-radius:5px;background:var(--other);overflow:hidden;margin:14px 0 6px}
.fillbar>div{height:100%;background:var(--used)}
.callout{border-left:3px solid var(--note);padding:10px 14px;margin:18px 0 0;background:var(--surface);max-width:70ch}
.callout.warn{border-color:var(--warn)}
.callout.ok{border-color:var(--ok)}
.callout b{display:block;margin-bottom:2px}
.lead{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.items{margin:14px 0 0;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.item .size{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .size small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.item .title{font-weight:600}
.item p{margin:2px 0 0;color:var(--ink2);max-width:68ch}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:8px;vertical-align:1px;border:1px solid var(--axis);color:var(--ink2)}
.chip.warn{color:#9a5b00;border-color:#d99a2b}
.chip.bad{color:var(--warn);border-color:var(--warn)}
code,.cmd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:1px 5px}
.cmdbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.cmdbox .cmd{padding:7px 10px;font-size:13px}
.copy{appearance:none;font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--axis);background:var(--page);color:var(--ink2);border-radius:5px;padding:5px 10px}
.copy:hover{color:var(--ink)}
.quiet{color:var(--muted);font-size:13px;margin:10px 0 0}
.card{padding:14px 0;border-bottom:1px solid var(--rule)}
.card:last-child{border-bottom:0}
.card .top{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.card .title{font-weight:600}
.card .size{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.card p{margin:4px 0 0;color:var(--ink2);max-width:70ch}
.card .how{color:var(--ink)}
.card details{margin-top:6px}
.card ul{margin:6px 0 0;padding-left:18px;color:var(--ink2);font-size:13px}
.changes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin:6px 0 0}
.change .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.change .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.change .n{color:var(--ink2);font-size:13px}
.treecontrols{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.treecontrols .seg{margin-bottom:14px}
/* history */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.filters select,.filters input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--axis);border-radius:5px;background:var(--page);color:var(--ink)}
.filters input{min-width:200px}
.run{border:1px solid var(--rule);border-radius:6px;margin:0 0 10px;background:var(--page)}
.run>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--ink)}
.run>summary::-webkit-details-marker{display:none}
.run>summary .when{font-weight:600}
.run>summary .meta2{color:var(--ink2);font-size:13px}
.run .scroll{padding:0 14px 10px}
.res{font-size:12px;font-weight:600}
.res.failed{color:var(--warn)}
.res.skipped{color:var(--muted)}
@media (max-width:560px){.item{grid-template-columns:76px minmax(0,1fr);gap:10px}.statusline .big{font-size:32px}}
</style>
</head>
<body>
<main>
<header>
  <h1>mac-headroom</h1>
  <p class="meta" id="meta"></p>
</header>
<div id="tip"></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="Report sections">
  <button role="tab" data-panel="overview" aria-controls="p-overview" aria-selected="true">Overview</button>
  <button role="tab" data-panel="explore" aria-controls="p-explore" aria-selected="false">Explore</button>
  <button role="tab" data-panel="history" aria-controls="p-history" aria-selected="false">History<span class="n" id="nRuns"></span></button>
</nav>
<div class="panel" id="p-overview" role="tabpanel" aria-labelledby="tabs">
  <section id="status"></section>
  <section id="changed" hidden></section>
  <section id="freeable"></section>
  <section id="look"></section>
  <section id="weekly" hidden></section>
</div>
<div class="panel" id="p-explore" role="tabpanel" aria-labelledby="tabs" hidden>
  <section id="disk"></section>
  <section id="volumes"></section>
  <section id="history"></section>
  <section id="space"></section>
</div>
<div class="panel" id="p-history" role="tabpanel" aria-labelledby="tabs" hidden>
  <section id="job"></section>
  <section id="audit"></section>
  <section id="cleaners"></section>
</div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const GB = 1000 ** 3, U = ['B','KB','MB','GB','TB'];
// Decimal, like Finder and src/util.rs: a KB is 1000 bytes. The carry keeps
// 999.6 MB from printing as "1000 MB", a unit short of itself.
const h = b => { let v = Math.abs(b), i = 0; while (v >= 1000 && i < 4) { v /= 1000; i++; }
  if (v >= 999.5 && i < 4) { v /= 1000; i++; }
  return (i ? v.toFixed(v < 10 ? 1 : 0) : v) + ' ' + U[i]; };
const sg = d => (d < 0 ? '−' : '+') + h(d);
const when = t => new Date(t * 1000).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const day = t => new Date(t * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const ago = t => { const s = Math.max(0, D.generated_at - t), d = s / 86400 | 0, hh = s % 86400 / 3600 | 0, m = s % 3600 / 60 | 0;
  return d ? `${d}d ${hh}h ago` : hh ? `${hh}h ${m}m ago` : `${m}m ago`; };
const tilde = p => p.startsWith(D.home) ? '~' + p.slice(D.home.length) : p;
// A list inside a sentence: "A", "A and B", "A, B and C". Joining three or
// more with "and" alone reads as a chain rather than a list.
const listOf = xs => xs.length < 3 ? xs.join(' and ') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const $ = id => document.getElementById(id);
const tip = $('tip');
const showTip = (html, x, y) => { tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - tip.offsetWidth - 8)) + 'px';
  tip.style.top = (y + 16 + tip.offsetHeight > innerHeight ? y - tip.offsetHeight - 10 : y + 16) + 'px'; };
const hideTip = () => { tip.style.display = 'none'; };

$('meta').textContent = `${D.host} · ${when(D.generated_at)} · v${D.version}`;

/* ---------- helpers for plain text with `code` ---------- */
const rich = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');
const titleOf = name => { const c = (D.cleaners || []).find(c => c.name === name); return c ? (c.title || c.summary || name) : name; };
const copyBtn = cmd => `<button class="copy" data-copy="${esc(cmd)}">Copy</button>`;
/* A GitHub issue form, pre-filled. Nothing is sent: the reader checks it and decides. */
const suggestUrl = (fields = {}) => {
  let u = `${D.repository}/issues/new?template=suggest-cleaner.yml`;
  for (const [k, v] of Object.entries(fields)) if (v) u += `&${k}=${encodeURIComponent(v)}`;
  return u;
};
const tomlStr = v => '"' + String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
const configEntry = k => ['[[cleaner]]', `name = ${tomlStr(k.name)}`, `summary = ${tomlStr(k.summary)}`, `why_safe = ${tomlStr(k.why_safe)}`,
  k.paths && k.paths.length ? `paths = [${k.paths.map(tomlStr).join(', ')}]` : '',
  k.command && k.command.length ? `command = [${k.command.map(tomlStr).join(', ')}]` : '',
  k.keep_newest != null ? `keep_newest = ${k.keep_newest}` : '',
  k.older_than_days != null ? `older_than_days = ${k.older_than_days}` : '',
  k.skip_if_running ? `skip_if_running = ${tomlStr(k.skip_if_running)}` : ''].filter(Boolean).join('\n');
const suggestLine = `<p class="quiet">Know something else that takes up space and is safe to clear? <a href="${suggestUrl()}" target="_blank" rel="noopener">Suggest it as a built-in</a>, or run <code>mac-headroom suggest</code>.</p>`;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const text = b.dataset.copy;
  const done = () => { const o = b.textContent; b.textContent = 'Copied'; setTimeout(() => { b.textContent = o; }, 1400); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, () => {}); return; }
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (err) { /* select it for the reader */ }
  ta.remove();
});
const DAY = 86400;
const H = D.history || [];
/* The reading to compare the latest against: the newest one at least a day
   older, or the first while the record is younger than that. Chosen by age
   and not by position, because readings now arrive hourly and an hour ago is
   too close for anything to have moved. The tool's diagnose does the same. */
function baselineReading() {
  if (H.length < 2) return null;
  const last = H[H.length - 1];
  for (let i = H.length - 2; i >= 0; i--) if (last.at - H[i].at >= DAY) return H[i];
  return H[0];
}
/* Everything from the last week, then the last reading of each day before
   it. The chart draws every point; a table of thousands of rows helps nobody. */
function thinnedReadings() {
  if (!H.length) return [];
  const cutoff = H[H.length - 1].at - 7 * DAY, out = [];
  for (let i = 0; i < H.length; i++) {
    const r = H[i], next = H[i + 1];
    if (r.at >= cutoff || !next || new Date(next.at * 1000).toDateString() !== new Date(r.at * 1000).toDateString()) out.push(r);
  }
  return out;
}
const returning = H.length >= 2 && (H[H.length - 1].at - H[0].at) >= DAY / 2;

/* Days until full, from the trend of free space over the last month. */
function daysUntilFull() {
  const recent = H.filter(r => r.at >= D.generated_at - 30 * DAY);
  if (recent.length < 3 || recent[recent.length - 1].at - recent[0].at < 2 * DAY) return null;
  const n = recent.length, mx = recent.reduce((s, r) => s + r.at, 0) / n, my = recent.reduce((s, r) => s + r.free, 0) / n;
  let num = 0, den = 0;
  for (const r of recent) { num += (r.at - mx) * (r.free - my); den += (r.at - mx) ** 2; }
  if (!den) return null;
  const perSec = num / den;
  if (perSec >= 0) return Infinity;
  return (recent[recent.length - 1].free) / (-perSec * DAY);
}

/* ---------- Status ---------- */
(() => {
  const el = $('status'), d = D.disk;
  if (!d) { el.innerHTML = '<p class="empty">The disk could not be read.</p>'; return; }
  const pct = 100 * d.free / d.total;
  const [lvl, word] = pct < 5 ? ['full', 'Nearly full'] : pct < 8 ? ['low', 'Running low']
    : pct < 15 ? ['tight', 'Getting tight'] : pct < 25 ? ['good', 'Doing fine'] : ['good', 'Plenty of space'];
  const days = daysUntilFull();
  const trend = days == null ? '' : days === Infinity ? ' Free space has not been shrinking lately.'
    : days > 365 ? ' At the current rate it will not fill up for over a year.'
    : ` At the rate it has been filling, it will be full in about <b>${Math.max(1, Math.round(days))} days</b>.`;

  /* Hidden space: the check the tool exists for, in plain words. */
  let hidden = '';
  if (D.update_snapshot_pinned) {
    hidden = `<div class="callout warn"><b>A macOS update is holding on to space</b>macOS has downloaded an update and is keeping a snapshot of your disk until it is installed. That space does not appear in Finder or anywhere below. Installing the update and restarting gives it back.</div>`;
  } else if (H.length >= 2) {
    const a = baselineReading(), b = H[H.length - 1];
    const gap = -(b.free - a.free) - (b.used - a.used);
    hidden = gap > 2 * GB
      ? `<div class="callout warn"><b>About ${h(gap)} is being held by macOS</b>Since ${day(a.at)}, free space fell by more than your files grew. That difference is not in any folder. It is usually temporary space macOS keeps for an update or a backup; restarting or installing a pending update normally releases it.</div>`
      : `<div class="callout ok"><b>No space is stuck</b>Your used and free space add up, so macOS is not holding space back for an update or a backup.</div>`;
  }
  const job = D.schedule && D.schedule.installed

/* ---------- What changed (returning visitors only) ---------- */

/* ---------- Space over time: the gap is the point ---------- */
(() => {

  const line = f => H.map((r, i) => (i ? 'L' : 'M') + X(r.at).toFixed(1) + ' ' + Y(f(r)).toFixed(1)).join(' ');
  const last = H[H.length - 1], gap = d.total - last.used - last.free;
  const T_ROWS = thinnedReadings();
  const young = last.at - H[0].at < 7 * 86400;
  el.innerHTML = `<h2>Space over time</h2>
    <div class="keys" style="margin-bottom:10px">
      <span><i class="sw" style="background:var(--used)"></i>your files and apps</span>
      <span><i class="sw" style="background:var(--free)"></i>free</span>
      <span><i class="ln" style="background:var(--ink2)"></i>capacity</span>
      <span class="muted">in GB · the gap below the line is macOS's own share</span>
    </div>
    <svg viewBox="0 0 ${W} ${HT}" id="hsvg" role="img" aria-label="Used and free space stacked against capacity">
      <g>${grid}</g>
      <polygon points="${area(() => 0, r => r.used)}" fill="var(--used)" opacity=".85"/>
      <polygon points="${area(r => r.used, r => r.used + r.free)}" fill="var(--free)" opacity=".85"/>
      <path d="${line(r => r.used + r.free)}" fill="none" stroke="var(--page)" stroke-width="2"/>
      <line x1="${L}" x2="${W - R}" y1="${Y(d.total)}" y2="${Y(d.total)}" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text class="ax" x="${W - R}" y="${Y(d.total) - 7}" text-anchor="end">capacity ${h(d.total)}</text>

      <g>${ticks}</g>

      <text class="ax" x="${L}" y="${HT - 12}">${day(H[0].at)}</text>
      <text class="ax" x="${W - R}" y="${HT - 12}" text-anchor="end">${day(last.at)}</text>
    </svg>

/* ---------- Where the space is: one tree, two views ---------- */
(() => {
  const el = $('space'), g = D.growth, d = D.disk;
  if (!g) {
    el.innerHTML = '<h2>Where the space is</h2><p class="empty">No scan saved yet. Run <span class="mono">mac-headroom growth</span> once for a baseline, then again later for the difference. The weekly job does both for you.</p>';
    return;
  }
  const extra = D.growth_roots || [];
  const scans = [g, ...extra];
  const canChange = scans.some(s => s.previous_at != null);
  const skipped = scans.reduce((s, r) => s + (r.skipped || 0), 0);
  const leaf = p => { const t = tilde(p); return t.split('/').filter(Boolean).pop() || t; };
  let mode = 'size';
  /* Hide rows below a size, for when only the big picture matters. Totals stay
     true; the tree just skips detail. Remembered between visits. */
  let MIN = 0;
  try { MIN = Math.max(0, +localStorage.getItem('mh-tree-min') || 0) * GB; } catch (e) { MIN = 0; }

  /* Nest one scan's entries by path. */
  function nest(scan) {
    const byPath = new Map(scan.entries.map(e => [e.path, { ...e, kids: [] }]));
    const roots = [];
    for (const node of byPath.values()) {
      let parent = null, best = -1;
      for (const p of byPath.keys()) {
        if (p !== node.path && node.path.startsWith(p + '/') && p.length > best) { best = p.length; parent = p; }
      }
      (parent ? byPath.get(parent).kids : roots).push(node);
    }
    return roots;
  }

  function buildRows() {
    const change = mode === 'change';
    const val = e => change ? (e.delta || 0) : e.bytes;
    const floor = Math.max(g.min_bytes, MIN);
    const keep = e => Math.abs(val(e)) >= floor;
    const rows = [];
    const walk = (nodes, depth) => {
      nodes.filter(keep).sort((a, b) => Math.abs(val(b)) - Math.abs(val(a))).forEach(n => {
        rows.push({ label: leaf(n.path), full: n.path, v: val(n), depth, node: n,
          parent: n.kids.some(keep) });
        if (n.kids.some(keep)) {
          walk(n.kids, depth + 1);
          const rest = val(n) - n.kids.filter(keep).reduce((s, k) => s + val(k), 0);
          if (Math.abs(rest) >= floor) {
            rows.push({ label: 'everything else in ' + leaf(n.path), full: n.path, v: rest, depth: depth + 1, rest: true });
          }
        }
      });
    };
    /* A scan's own subtree: the root row, its contents, then its remainder. */
    const subtree = (scan, depth, label, tipText, secondary) => {
      const roots = nest(scan);
      const total = change ? (scan.previous_total != null ? scan.total - scan.previous_total : 0) : scan.total;
      rows.push({ label, full: scan.root, v: total, depth, parent: roots.some(keep), tipText,
        secondary, skipped: scan.skipped });
      walk(roots, depth + 1);
      const rest = total - roots.filter(keep).reduce((s, k) => s + val(k), 0);
      if (Math.abs(rest) >= floor) {
        rows.push({ label: 'everything else in ' + label, full: scan.root, v: rest, depth: depth + 1, rest: true });
      }
    };

    const covered = scans.reduce((s, r) => s + (change ? 0 : r.total), 0);
    const reconcile = !change && d && d.used > covered;
    if (change) {
    /* Top-level locations largest first, by size or by how much they changed. */
      const tops = [[g, '~ (your home folder)', 'The home folder, ' + g.depth + ' levels deep.', false],
        ...extra.map(r => [r, tilde(r.root), 'Scanned alongside your home folder.', true])]
        .sort((a, b) => change
          ? Math.abs(b[0].total - (b[0].previous_total ?? b[0].total)) - Math.abs(a[0].total - (a[0].previous_total ?? a[0].total))
          : b[0].total - a[0].total);
      tops.forEach(([scan, label, tip, secondary]) => subtree(scan, 0, label, tip, secondary));
    } else {
      rows.push({ label: 'Your data', v: d ? d.used : covered, depth: 0, parent: true, sum: true,
        tipText: 'Volume Used Space, straight from diskutil. Everything stored on the data volume.' });
    /* Top-level locations largest first, by size or by how much they changed. */
      const tops = [[g, '~ (your home folder)', 'The home folder, ' + g.depth + ' levels deep.', false],
        ...extra.map(r => [r, tilde(r.root), 'Scanned alongside your home folder.', true])]
        .sort((a, b) => change
          ? Math.abs(b[0].total - (b[0].previous_total ?? b[0].total)) - Math.abs(a[0].total - (a[0].previous_total ?? a[0].total))
          : b[0].total - a[0].total);
      tops.forEach(([scan, label, tip, secondary]) => subtree(scan, 1, label, tip, secondary));
      if (reconcile) {
        const blocked = D.findings && D.findings.full_disk_access === false;
        rows.push({ label: blocked ? 'not accounted for (includes your Trash)' : 'not accounted for', v: d.used - covered, depth: 1, rest: true, unscanned: true,
          tipText: blocked
            ? 'Space the scan could not reach. macOS blocked it from reading your Trash and other private folders, and the rest is filesystem overhead and files only macOS itself can read.'
            : 'Space the scan could not reach: filesystem overhead and files only macOS itself can read.' });
      }
    }
    return rows;
  }

  function draw() {
    const change = mode === 'change';
    const rows = buildRows();
    const denom = Math.max(...rows.map(r => Math.abs(r.v)), 1);
    const render = (r, i) => {
      const w = Math.max(0.6, 100 * Math.abs(r.v) / denom) / (change ? 2 : 1);
      const bar = change
        ? `<div class="mid"></div><div class="bar ${r.v >= 0 ? 'pos' : 'neg'}" style="${r.v >= 0 ? 'left' : 'right'}:50%;width:${w}%"></div>`
        : `<div class="bar" style="left:0;width:${w}%"></div>`;
      const tag = r.rest || !r.node ? ''
        : r.node.access === 'unreadable_now' ? '<span class="tag">not read this time</span>'
        : r.node.access === 'unreadable_before' ? '<span class="tag">not read last time</span>'
        : change && r.node.previous == null ? '<span class="tag">new</span>'
        : change && r.node.bytes === 0 ? '<span class="tag">gone</span>' : '';
      const tipHtml = r.tipText ? `<b>${esc(r.label)}</b><br>${esc(r.tipText)}`
        : r.rest ? `<b>${esc(tilde(r.full || ''))}</b><br>not in any row below it: ${change ? sg(r.v) : h(r.v)}`
        : r.node.access === 'unreadable_now' ? `<b>${esc(tilde(r.full))}</b><br>This scan was not allowed to read it, so there is no figure for now. It was ${h(r.node.previous)} last time. It has not been deleted.`
        : r.node.access === 'unreadable_before' ? `<b>${esc(tilde(r.full))}</b><br>now ${h(r.node.bytes)}<br>The last scan was not allowed to read it, so this is not new and there is no change to report.`
        : `<b>${esc(tilde(r.full))}</b><br>now ${h(r.node.bytes)}` + (r.node.delta != null ? `<br>before ${r.node.previous == null ? 'not present' : h(r.node.previous)}<br>change ${sg(r.node.delta)}` : '');
      return `<div class="node${r.rest ? ' rest' : ''}${r.sum ? ' sum' : ''}${r.parent ? ' open' : ''}" data-i="${i}" data-tip="${esc(tipHtml)}">
        <div class="nm" style="padding-left:${r.depth * 20 + 16}px">
          <span class="tw${r.parent ? '' : ' leaf'}">${r.parent ? '▶' : ''}</span>
          <span class="lbl">${esc(r.label)}${tag}</span>
        </div>
        <div class="track">${bar}</div>
        <div class="amt">${change ? sg(r.v) : h(r.v)}</div></div>`;
    };
    $('tree').innerHTML = rows.length ? rows.map(render).join('')
      : '<p class="empty">Nothing changed by that much.</p>';
    $('caption').innerHTML = change
      ? `Change since the scan ${ago(g.previous_at)}. Only movements of ${h(Math.max(g.min_bytes, MIN))} or more.`
      : `Indented rows sit <em>inside</em> the row above, so a parent and its child are never two separate claims on the same space.${extra.length ? '' : ' Only <span class="mono">~</span> is scanned; add paths to <span class="mono">scan_roots</span> in the config to cover the rest of the volume.'}`;
    $('key').style.display = change ? '' : 'none';

    const un = rows.find(r => r.unscanned);
    const hint = $('unscanned');
    if (un && un.v > 2 * GB) {
      hint.style.display = '';
      const blocked = D.findings && D.findings.full_disk_access === false;
      hint.innerHTML = blocked
        ? `<b>${h(un.v)} could not be accounted for, and part of it is folders the scan was not allowed to read, including your Trash.</b>
          macOS privacy protection stops this scan reading your Trash, along with a few other private folders such as Mail.
          To include them, open <b>System Settings &gt; Privacy &amp; Security &gt; Full Disk Access</b>, turn on your terminal app,
          then quit and reopen the terminal and run <code>mac-headroom</code> again. The rest is filesystem overhead and files only macOS can read.`
        : `<b>${h(un.v)} could not be accounted for.</b> Most of it is usually filesystem overhead and files only macOS itself can read,
          such as parts of <code>/private/var</code>. None of it is anything you could safely clear by hand.`;
    } else {
      hint.style.display = 'none';
    }
    if (!rows.length) { $('treecount').textContent = ''; return; }
    const els = [...$('tree').querySelectorAll('.node')];
    /* Open the home folder to one level; the system roots stay folded so the
       default view is the part of the disk you actually manage. */
    const collapsed = new Set(rows
      .map((r, i) => r.parent && (r.secondary || r.depth >= (change ? 1 : 2)) ? i : -1)
      .filter(i => i >= 0));
    const refresh = () => {
      let hideBelow = Infinity, shown = 0;
      rows.forEach((r, i) => {
        const hidden = r.depth > hideBelow;
        if (!hidden) { hideBelow = collapsed.has(i) ? r.depth : Infinity; shown++; }
        els[i].style.display = hidden ? 'none' : '';
        els[i].classList.toggle('open', r.parent && !collapsed.has(i));
      });
      $('treecount').textContent = `${shown} of ${rows.length} rows`;
    };
    $('tree').onclick = e => {
      const row = e.target.closest('.node');
      if (!row) return;
      const i = +row.dataset.i;
      if (!rows[i].parent) return;
      collapsed.has(i) ? collapsed.delete(i) : collapsed.add(i);
      refresh();
    };
    $('expand').onclick = () => { collapsed.clear(); refresh(); };
    $('collapse').onclick = () => { rows.forEach((r, i) => { if (r.parent && r.depth >= 1) collapsed.add(i); }); refresh(); };
    refresh();
  }

  el.innerHTML = `<h2>Where the space is</h2>
    <div class="treecontrols">
    <div class="seg">
      <button id="mSize" aria-pressed="true">Size</button>
      <button id="mChange" aria-pressed="false" ${canChange ? '' : 'disabled title="Needs a second scan to compare against"'}>Change</button>
    </div>
    <div class="seg" role="group" aria-label="Smallest folder shown" id="mMin">
      ${[0, 1, 2, 5].map(g => `<button data-min="${g}" aria-pressed="${g * GB === MIN}">${g ? g + ' GB+' : 'Any size'}</button>`).join('')}
    </div>
    </div>
    <p class="cap" id="caption" style="margin:0 0 14px"></p>
    <div class="keys" id="key" style="margin-bottom:12px;display:none"><span><i class="sw" style="background:var(--grow)"></i>grew</span><span><i class="sw" style="background:var(--shrink)"></i>shrank</span></div>
    <div class="treebar"><span class="muted" id="treecount"></span><span><button id="expand">expand all</button> · <button id="collapse">collapse all</button></span></div>
    <div class="tree" id="tree"></div>
    <p class="floor" id="unscanned" style="display:none"></p>
    ${skipped ? `<p class="floor">${skipped.toLocaleString()} entries could not be read, almost always inside a system directory, so those totals are a floor rather than the whole figure. They are files only macOS itself can read.</p>` : ''}
    ${suggestLine}`;
  const set = m => { mode = m; $('mSize').setAttribute('aria-pressed', m === 'size'); $('mChange').setAttribute('aria-pressed', m === 'change'); draw(); };
  $('mSize').onclick = () => set('size');
  $('mChange').onclick = () => { if (canChange) set('change'); };
  $('mMin').querySelectorAll('[data-min]').forEach(b => {
    b.onclick = () => {
      MIN = +b.dataset.min * GB;
      try { localStorage.setItem('mh-tree-min', b.dataset.min); } catch (e) { /* not important */ }
      $('mMin').querySelectorAll('[data-min]').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      draw();
    };
  });
  draw();
})();

/* ---------- Weekly check health ---------- */
(() => {
  const s = D.schedule, el = $('job');
  if (!s.installed) {
    el.innerHTML = `<h2>Weekly check</h2><p class="empty">Not set up. <code>mac-headroom schedule install</code> clears the safe items once a week and warns you when space runs low.</p>`;
    return;
  }
  const A = D.audit || [];
  const lastAt = A.length ? Math.max(...A.map(a => a.at)) : null;
  const failed = A.filter(a => a.at === lastAt && a.result === 'failed');
  el.innerHTML = `<h2>Weekly check</h2>
    ${failed.length ? `<div class="callout warn" style="margin-top:0"><b>${failed.length} item${failed.length > 1 ? 's' : ''} failed on the last run</b>${failed.map(f => `${esc(titleOf(f.cleaner))}${f.detail ? `: <span class="muted">${esc(f.detail)}</span>` : ''}`).join('<br>')}</div>`
      : A.length ? `<div class="callout ok" style="margin-top:0"><b>Healthy</b>Everything on the last run worked.</div>` : ''}
    <table style="margin-top:16px">
      <tr><th style="width:130px">Status</th><td><span class="dot ${s.loaded ? 'on' : 'no'}"></span>${s.loaded ? 'On' : 'Installed but not running; run schedule install again'}</td></tr>
      <tr><th>Runs</th><td>${esc(s.schedule || '?')}, or when your Mac next wakes</td></tr>
      <tr><th>Low space alert</th><td>${s.watch_loaded ? `Checks hourly, notifies under ${s.alert_below_percent}% free` : 'Off'}</td></tr>
      <tr><th>Last run</th><td>${s.last_run ? esc(s.last_run) : 'Not yet'}</td></tr>
    </table>
    ${D.last_run_log ? `<details><summary>Full output of the last run</summary><pre>${esc(D.last_run_log)}</pre></details>` : ''}`;
})();

/* ---------- Deletions, grouped by run, filterable ---------- */
(() => {
  const el = $('audit'), A = D.audit || [];
  if (!A.length) {
    el.innerHTML = '<h2>What has been removed</h2><p class="empty">Nothing yet. Everything mac-headroom removes is recorded here, so if something ever goes missing you can check whether this was the cause.</p>';
    return;
  }
  const cleanersIn = [...new Set(A.map(a => a.cleaner))].sort((a, b) => titleOf(a).localeCompare(titleOf(b)));
  el.innerHTML = `<h2>What has been removed</h2>
    <p class="sub">Every removal is recorded, so if something ever goes missing you can check whether this was the cause. A dash means a tool cleaned its own cache and the amount could not be measured.</p>
    <div class="filters">
      <select id="fCleaner"><option value="">Every cleaner</option>${cleanersIn.map(c => `<option value="${esc(c)}">${esc(titleOf(c))}</option>`).join('')}</select>
      <select id="fResult"><option value="">Every result</option><option value="deleted">Removed</option><option value="ran">Ran</option><option value="failed">Failed</option></select>
      <input id="fText" type="search" placeholder="Search paths">
      <span class="quiet" id="fCount" style="margin:0"></span>
    </div>
    <div id="runs"></div>`;
  const label = r => r === 'deleted' ? 'Removed' : r === 'ran' ? 'Ran' : r === 'failed' ? 'Failed' : r;
  function draw() {
    const fc = $('fCleaner').value, fr = $('fResult').value, ft = $('fText').value.trim().toLowerCase();
    const rows = A.filter(a => (!fc || a.cleaner === fc) && (!fr || a.result === fr) && (!ft || a.path.toLowerCase().includes(ft)));
    const groups = new Map();
    for (const r of rows) { if (!groups.has(r.at)) groups.set(r.at, []); groups.get(r.at).push(r); }
    const ordered = [...groups.entries()].sort((a, b) => b[0] - a[0]);
    $('fCount').textContent = `Showing ${rows.length} of ${A.length}`;
    $('runs').innerHTML = ordered.length ? ordered.map(([at, rs], i) => {
      const freed = rs.reduce((s, r) => s + (r.bytes || 0), 0);
      const measured = rs.some(r => r.bytes != null);
      const fails = rs.filter(r => r.result === 'failed').length;
      return `<details class="run" ${i < 3 ? 'open' : ''}>
        <summary><span class="when">${when(at)}</span><span class="meta2">${rs.length} item${rs.length > 1 ? 's' : ''} · ${measured ? `${h(freed)} freed` : 'not measured'}${fails ? ` · <span class="res failed">${fails} failed</span>` : ''}</span></summary>
        <div class="scroll"><table>
          <tr><th>What</th><th>Result</th><th class="r">Size</th><th>Path or command</th></tr>
          ${rs.map(r => `<tr><td>${esc(titleOf(r.cleaner))}</td><td><span class="res ${esc(r.result)}">${esc(label(r.result))}</span></td><td class="r">${r.bytes == null ? '<span class="muted" title="Not measured">—</span>' : h(r.bytes)}</td><td class="mono">${esc(tilde(r.path))}${r.detail ? `<div class="muted" style="font-family:inherit;margin-top:2px">${esc(r.detail)}</div>`
            : r.result === 'failed' ? `<div class="muted" style="font-family:inherit;margin-top:2px">No reason recorded. Failures are only explained from version 0.2.2 on.</div>` : ''}</td></tr>`).join('')}
        </table></div></details>`;
    }).join('') : '<p class="empty">Nothing matches those filters.</p>';
  }
  ['fCleaner', 'fResult', 'fText'].forEach(id => $(id).addEventListener('input', draw));
  draw();
})();

/* ---------- Every cleaner, for reference ---------- */
(() => {
  const el = $('cleaners'), c = D.config, list = D.cleaners || [];
  const rows = list.map(k => `<tr class="${k.disabled ? 'off' : ''}">
      <td><b>${esc(k.title || k.summary)}</b><div class="muted mono" style="margin-top:2px">${esc(k.name)}${k.opt_in ? ' · only when asked for by name' : ''}${k.disabled ? ' · turned off' : ''}</div>${k.source === 'config'
        ? `<div style="margin-top:4px"><a href="${esc(suggestUrl({ title: 'Cleaner: ' + k.summary, what: k.summary, locations: (k.paths || []).join('\n'), why_safe: k.why_safe, config: configEntry(k) }))}" target="_blank" rel="noopener">Suggest adding this to mac-headroom</a></div>` : ''}</td>
      <td>${esc(k.plain || k.why_safe)}${k.plain ? `<details><summary class="quiet" style="display:list-item">Why this is safe, in detail</summary><p class="muted">${esc(k.why_safe)}</p></details>` : ''}</td>
    </tr>`).join('');
  el.innerHTML = `<details><summary><h2 style="display:inline">Every cleaner, in detail</h2></summary>
    <p class="sub" style="margin-top:12px">${c.exists ? `Your own cleaners are in <code>${esc(tilde(c.path))}</code>.` : 'Add your own with <code>mac-headroom config init</code>.'}</p>
    ${c.problems.length ? `<p class="cap" style="color:var(--warn)">${c.problems.map(esc).join('<br>')}</p>` : ''}
    <div class="scroll"><table><tr><th>Cleaner</th><th>What it removes</th></tr>${rows}</table></div></details>`;
})();

/* ---------- Tabs ---------- */
(() => {
  const tabs = [...document.querySelectorAll('#tabs button')];
  const names = tabs.map(t => t.dataset.panel);
  const show = name => {
    tabs.forEach(t => {
      const on = t.dataset.panel === name;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      $('p-' + t.dataset.panel).hidden = !on;
    });
    try { localStorage.setItem('mh-tab', name); } catch (e) { /* not important */ }
    if (location.hash.slice(1) !== name) {
      try { history.replaceState(null, '', '#' + name); } catch (e) { /* file:// */ }
    }
    hideTip();
  };
  tabs.forEach(t => { t.onclick = () => show(t.dataset.panel); });
  $('tabs').addEventListener('keydown', e => {
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!step) return;
    e.preventDefault();
    const next = tabs[(i + step + tabs.length) % tabs.length];
    next.focus();
    show(next.dataset.panel);
  });
  const runsCount = new Set((D.audit || []).map(a => a.at)).size;
  if (runsCount) $('nRuns').textContent = runsCount;
  /* Always land on the overview: it is the answer. A link can still open another tab. */
  const start = location.hash.slice(1);
  show(names.includes(start) ? start : 'overview');
  addEventListener('hashchange', () => {
    const n = location.hash.slice(1);
    if (names.includes(n)) show(n);
  });
})();

document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (t) showTip(t.dataset.tip, e.clientX, e.clientY);
  else if (!e.target.closest('#hsvg')) hideTip();
});
</script>
</body>
</html>
